<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice Cover Studio — GTA 6-style cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NEON VICE <span>COVER STUDIO</span></div>
  <div class="tagline">Turn any photo + caption into GTA&nbsp;6-style cover art</div>
</header>

<main class="studio">
  <section class="preview">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p class="hint">Drag the cover to pan the photo &middot; use the zoom slider to zoom</p>
  </section>

  <section class="controls">
    <div class="field">
      <label for="photoInput">Photo</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="field">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" value="NEON SHORE" maxlength="40" autocomplete="off">
    </div>

    <div class="field">
      <label for="subtitleInput">Subtitle</label>
      <input type="text" id="subtitleInput" value="VICE CITY &bull; 2026" maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <span class="label">Sample photos</span>
      <div id="samples" class="btn-row">
        <button type="button" data-sample="pier">Pier</button>
        <button type="button" data-sample="boulevard">Boulevard</button>
        <button type="button" data-sample="sunset-palms">Sunset Palms</button>
        <button type="button" data-sample="neon-street">Neon Street</button>
      </div>
    </div>

    <div class="field">
      <span class="label">Layout</span>
      <div id="layoutRow" class="btn-row">
        <button type="button" data-layout="hero" class="active">Hero + 3</button>
        <button type="button" data-layout="grid">Four grid</button>
        <button type="button" data-layout="triptych">Triptych</button>
        <button type="button" data-layout="bleed">Full bleed</button>
      </div>
    </div>

    <div class="field">
      <span class="label">Grade</span>
      <div id="gradeRow" class="btn-row">
        <button type="button" data-grade="vice-sunset" class="active">Vice Sunset</button>
        <button type="button" data-grade="neon-night">Neon Night</button>
        <button type="button" data-grade="palm-gold">Palm Gold</button>
        <button type="button" data-grade="ocean-dusk">Ocean Dusk</button>
        <button type="button" data-grade="noir">Noir</button>
      </div>
    </div>

    <div class="field">
      <label for="zoomRange">Zoom <span id="zoomValue">1.00&times;</span></label>
      <input type="range" id="zoomRange" min="0.8" max="2.5" step="0.05" value="1">
    </div>

    <div class="field">
      <div class="btn-row">
        <button type="button" id="fillAllBtn">Fill all panels</button>
        <button type="button" id="centreBtn">Centre photo</button>
      </div>
    </div>

    <div class="field export">
      <label for="exportSize">Export size</label>
      <select id="exportSize">
        <option value="1080x1080">1080 &times; 1080 (square)</option>
        <option value="1080x1350">1080 &times; 1350 (portrait)</option>
        <option value="1920x1080">1920 &times; 1080 (wide)</option>
      </select>
      <button type="button" id="exportBtn" class="primary">Export PNG</button>
    </div>
  </section>
</main>

<footer class="foot">Neon Vice Cover Studio &middot; built for the make.fun gta6-cover-art-01 bounty &middot; fonts: Anton &amp; Pacifico (OFL)</footer>

<script src="src/cover.js"></script>
<script src="src/main.js"></script>
</body>
</html>
